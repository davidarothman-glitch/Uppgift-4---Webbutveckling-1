<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <link rel="stylesheet" href="oasis.css">
</head>

<body>
    <header>
        <img src="images/Header.jpg" alt="Header background">
        <img src="images/Hotel Logo.jpg" alt="Oasis Hotel logo" class="logo">
        <img src="images/Header.jpg" alt="Header background">
    </header>
    <nav>
        <a href="index.html">Welcome</a>
        <a href="Booking Oasis.html">Booking</a>
        <a href="Restaurant.html">Restaurant</a>
        <a href="Location.html">Location</a>
        <a href="About Us.html">About Us</a>
    </nav>

    <div class="Booking">
        <img src="images/Booking.jpg" alt="Beautiful Room">

        <form>
            <div class="booking-form">
                <h3>Book your Stay</h3>
                <br>
                <label for="Check-in">Check in</label>
                <br>
                <input type="date" id="Check-in" name="Check in">
                <br>
                <label for="Check-out">Check out</label>
                <br>
                <input type="date" id="Check-out" name="Check out">
                <br>
                <label for="Guests">Guests</label>
                <br>
                <select name="Guests">
                    <option value="1"> One</option>
                    <option value="2"> Two</option>
                    <option value="3"> Three</option>
                    <option value="4"> Four</option>
                    <option value="6"> Six</option>
                </select>
                <br>
                <label for="Room type">Room Type</label>
                <br>
                <select name="Room type">
                    <option value="Single Room">Single Room</option>
                    <option value="Double Room">Double Room</option>
                    <option value="Suite (4 persons)">Suite (can fit 4 persons)</option>
                    <option value="Presidential Suite (6 persons)">Presidential Suite (can fit 6 persons)</option>
                </select>
                <br>
                <br>
                <button>
                    <h3>Check Availability</h3>
                </button>
            </div>
        </form>
    </div>
</body>

</html>
